<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conexiones — El Argento</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
  <p class="dateline">El Argento</p>
  <h1>Conexiones</h1>
  <p class="tagline">Encontrá los cuatro grupos de cuatro palabras relacionadas.</p>
</header>

<main>
  <div id="solved" class="solved"></div>
  <div id="grid" class="grid"></div>
  <div class="secondary-controls">
    <button class="secondary" id="resetBtn">Rehacer</button>
    <button class="secondary" id="shuffleBtn">Mezclar</button>
  </div>
  <div class="controls">
    <div class="tries" id="tries"></div>
    <button class="submit" id="submitBtn" disabled>Confirmar</button>
  </div>

  <p class="toast" id="message"></p>

  <a class="back-link" href="index.html">← Volver</a>
</main>

<script src="data/puzzles.js"></script>
<script src="conexiones.js"></script>

</body>
</html>
